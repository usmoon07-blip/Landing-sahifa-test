<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>usmoai — logo variantlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0a0706; --fire: #ff5a1f; --fire-2: #ffa04a; --muted: #9a8d86; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #050404; color: #fff; font-family: "Poppins", system-ui, sans-serif; }
  svg { display: block; }
  .board { width: 1600px; background: var(--ink); }
  .top { position: relative; display: flex; justify-content: space-between; align-items: flex-end; padding: 60px 70px 46px; border-bottom: 1px solid rgba(255,255,255,.07); overflow: hidden; }
  .top::before { content: ""; position: absolute; width: 900px; height: 900px; right: -300px; top: -560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,90,31,.28), transparent 70%); }
  .top h1 { position: relative; margin: 0; font-size: 60px; font-weight: 700; letter-spacing: -0.03em; }
  .top h1 span { color: var(--fire); }
  .top p { position: relative; margin: 0; color: var(--muted); font-size: 18px; text-align: right; line-height: 1.6; }
  .row { display: grid; grid-template-columns: 420px 1fr 440px; height: 400px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .row > div { position: relative; display: grid; place-items: center; border-right: 1px solid rgba(255,255,255,.07); }
  .row > div:last-child { border-right: 0; }
  .big { background: radial-gradient(closest-side, rgba(255,90,31,.16), transparent 75%); }
  .num { position: absolute; top: 24px; left: 26px; width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; font-weight: 800; background: var(--fire); }
  .mid { grid-template-rows: 1fr 1fr; }
  .mid > div { width: 100%; height: 100%; display: grid; place-items: center; }
  .mid .dk { background: #0f0b09; border-bottom: 1px solid rgba(255,255,255,.07); }
  .mid .lt { background: #fff; }
  .lockup { display: flex; align-items: center; gap: 18px; }
  .word { display: inline-flex; align-items: center; font-size: 60px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
  .lt .word { color: var(--ink); }
  .word b { font-weight: 600; background: linear-gradient(100deg, var(--fire-2), var(--fire) 60%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .word .o { width: .6em; height: .6em; margin: .1em .02em 0; }
  .info { align-content: center; justify-items: start !important; padding: 0 44px; gap: 14px; }
  .info h2 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .info p { margin: 0; color: #d9d0cb; font-size: 17px; line-height: 1.5; }
  .chip { display: inline-block; vertical-align: middle; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; background: rgba(255,90,31,.15); color: var(--fire-2); }
  .sizes { display: flex; align-items: flex-end; gap: 20px; margin-top: 8px; }
  .sizes > div { text-align: center; color: var(--muted); font-size: 12px; }
  .sizes svg { margin: 0 auto 8px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: #17110e; display: grid; place-items: center; margin: 0 auto 8px; border: 1px solid rgba(255,255,255,.1); }
  .avatar.ig { background: linear-gradient(#17110e, #17110e) padding-box, linear-gradient(45deg, #ffa04a, #ff4a12, #ff2d6f) border-box; border: 3px solid transparent; }
  .foot { padding: 36px 70px 46px; color: var(--muted); font-size: 18px; }
  .foot b { color: #fff; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="92" y2="92"><stop offset="0" stop-color="#ffa04a"/><stop offset="1" stop-color="#ff4a12"/></linearGradient>
    <!-- 1: u + nuqta — "u" va "ai"dagi i nuqtasi -->
    <symbol id="m1" viewBox="0 0 100 100"><path d="M26 36 V58 A22 22 0 0 0 70 58 V40" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="18" r="8" stroke="none"/></symbol>
    <!-- 2: Orb — shar ichida u va nuqta -->
    <mask id="mk2" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M33 44 V56 A17 17 0 0 0 67 56 V44" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round"/><circle cx="50" cy="32" r="6.5" fill="#000"/></mask>
    <symbol id="m2" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" mask="url(#mk2)" stroke="none"/></symbol>
    <!-- 3: Ko'z — "o" harfi AI ko'zi/linzasi -->
    <symbol id="m3" viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="none" stroke-width="15"/><circle cx="50" cy="50" r="12" stroke="none"/></symbol>
    <!-- 4: Chat-u — xabar pufagi ichida u va nuqta -->
    <mask id="mk4" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M34 40 V52 A16 16 0 0 0 66 52 V44" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round"/><circle cx="66" cy="28" r="6" fill="#000"/></mask>
    <symbol id="m4" viewBox="0 0 100 100"><path mask="url(#mk4)" stroke="none" d="M50 8 C76 8 92 24 92 48 C92 72 76 86 50 86 C44 86 38 85 33 83 L14 92 L18 74 C11 67 8 58 8 48 C8 24 24 8 50 8 Z"/></symbol>
    <!-- 5: Uchqun — u va AI uchquni -->
    <symbol id="m5" viewBox="0 0 100 100"><path d="M22 36 V60 A22 22 0 0 0 66 60 V54" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 4 C73.5 18 77 21.5 91 23 C77 24.5 73.5 28 72 42 C70.5 28 67 24.5 53 23 C67 21.5 70.5 18 72 4 Z" stroke="none"/></symbol>
  </defs>
</svg>

<div class="board" id="board">
  <div class="top"><h1>usmo<span>ai</span> — logo variantlari</h1><p>@usmoai · Telegram · Instagram<br>Tanlash uchun raqamini ayting</p></div>
</div>

<script>
  const V = [
    { id: "m1", name: "u + nuqta", tag: "Tavsiya", idea: "Kichik “u” va uning ustida nuqta — “ai”dagi i ning nuqtasi, g‘oya uchquni. Eng sodda, toza va tez esda qoladi." },
    { id: "m2", name: "Orb", idea: "AI yordamchi shari ichida u va nuqta. Tabassumli yuzga ham o‘xshaydi — Telegram va Instagram avatari uchun ideal." },
    { id: "m3", name: "AI ko‘z", oWord: true, idea: "Nomdagi “o” harfi AI linzasiga aylanadi: usm◉ai. Belgi va yozuv bitta tizimga birlashadi — juda o‘ziga xos." },
    { id: "m4", name: "Chat-u", idea: "Xabar pufagi ichida u va nuqta. AI bilan suhbat, bot va yordamchi xizmatlarini darhol eslatadi." },
    { id: "m5", name: "Uchqun", idea: "u va to‘rt qirrali AI uchquni. Sun’iy intellekt bilan bog‘liqligi bir qarashda tushuniladi." }
  ];
  const use = (id, size, paint) => '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '"><use href="#' + id + '" fill="' + paint + '" stroke="' + paint + '"/></svg>';
  const fire = "url(#fire)";
  const word = (v) => v.oWord
    ? '<span class="word">usm<svg class="o" viewBox="0 0 100 100"><use href="#m3" fill="url(#fire)" stroke="url(#fire)"/></svg><b>ai</b></span>'
    : '<span class="word">usmo<b>ai</b></span>';
  const lockup = (v) => v.oWord ? word(v) : '<div class="lockup">' + use(v.id, 74, fire) + word(v) + "</div>";
  document.getElementById("board").insertAdjacentHTML("beforeend", V.map((v, i) =>
    '<div class="row">' +
      '<div class="big"><span class="num">' + (i + 1) + "</span>" + use(v.id, 220, fire) + "</div>" +
      '<div class="mid"><div class="dk">' + lockup(v) + '</div><div class="lt">' + lockup(v) + "</div></div>" +
      '<div class="info"><h2>' + v.name + (v.tag ? ' <span class="chip">' + v.tag + "</span>" : "") + "</h2><p>" + v.idea + "</p>" +
        '<div class="sizes"><div><div class="avatar">' + use(v.id, 36, fire) + '</div>Telegram</div><div><div class="avatar ig">' + use(v.id, 32, fire) + "</div>Instagram</div><div>" +
        use(v.id, 32, fire) + "32px</div><div>" + use(v.id, 32, "#ffffff") + "oq</div></div>" +
      "</div>" +
    "</div>").join("") +
    '<div class="foot">Yoqqan variant <b>raqamini</b> yozing — Telegram/Instagram avatari, ikonka, SVG/PNG va brend taxtasini tayyorlab beraman.</div>');
</script>
</body>
</html>
