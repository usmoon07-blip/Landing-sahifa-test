<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theusmondigital — barcha logo variantlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0a0706; --fire: #ff5a1f; --fire-2: #ffa04a; --muted: #9a8d86; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #050404; color: #fff; font-family: "Poppins", system-ui, sans-serif; }
  svg, img { display: block; }
  .board { width: 1600px; background: var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: flex-end; padding: 60px 70px 46px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .top h1 { margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -0.03em; }
  .top h1 span { color: var(--fire); }
  .top p { margin: 0; color: var(--muted); font-size: 18px; text-align: right; line-height: 1.6; }
  .group { padding: 22px 70px; font-size: 15px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--fire-2); background: rgba(255,90,31,.06); border-bottom: 1px solid rgba(255,255,255,.07); }
  .row { display: grid; grid-template-columns: 420px 1fr 440px; height: 400px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .row > div { position: relative; display: grid; place-items: center; border-right: 1px solid rgba(255,255,255,.07); overflow: hidden; }
  .row > div:last-child { border-right: 0; }
  .big { background: radial-gradient(closest-side, rgba(255,90,31,.16), transparent 75%); }
  .big svg { width: 230px; height: 230px; }
  .big img { width: 250px; border-radius: 18px; }
  .num { position: absolute; top: 24px; left: 26px; width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; font-weight: 800; background: var(--fire); }
  .light { background: #fff; }
  .light.dark { background: #0f0b09; }
  .light.dark img { width: 92%; border-radius: 12px; }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .lockup svg { width: 92px; height: 92px; }
  .word { font-size: 44px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); white-space: nowrap; }
  .word b { font-weight: 600; background: linear-gradient(100deg, var(--fire-2), var(--fire) 60%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .info { align-content: center; justify-items: start !important; padding: 0 44px; gap: 14px; }
  .info h2 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .info .src { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .info p { margin: 0; color: #d9d0cb; font-size: 17px; line-height: 1.5; }
  .sizes { display: flex; align-items: flex-end; gap: 22px; margin-top: 8px; }
  .sizes div { text-align: center; color: var(--muted); font-size: 12px; }
  .sizes svg { margin: 0 auto 8px; }
  .chip { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; background: rgba(255,90,31,.15); color: var(--fire-2); }
  .foot { padding: 36px 70px 46px; color: var(--muted); font-size: 18px; }
  .foot b { color: #fff; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="92" y2="92"><stop offset="0" stop-color="#ffa04a"/><stop offset="1" stop-color="#ff4a12"/></linearGradient>

    <!-- Saytdagi eski belgilar -->
    <symbol id="s-u" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="22" fill="#000" stroke="#3a3330" stroke-width="2"/><text x="50" y="70" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="58" fill="#ff5a1f">U</text></symbol>
    <symbol id="s-tri" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="22" fill="#000" stroke="#3a3330" stroke-width="2"/><g transform="translate(18 18) scale(2.67)"><path d="M5 4v9a7 7 0 0014 0V4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M12 10l4.5 8h-9z" fill="#ff5a1f"/></g></symbol>

    <!-- 1-variant: D-pufak -->
    <mask id="tu1" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><g fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M42 26 V55 A13 13 0 0 0 68 55 V38"/><path d="M32 39 H52"/></g></mask>
    <symbol id="v1" viewBox="0 0 100 100"><path mask="url(#tu1)" d="M20 10 H50 A40 40 0 0 1 50 90 H20 A8 8 0 0 1 12 82 V18 A8 8 0 0 1 20 10 Z"/></symbol>
    <!-- A: Qopqoq -->
    <symbol id="a" viewBox="0 0 100 100"><g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M26 34 V52 A24 24 0 0 0 74 52 V34"/><path d="M14 22 H86"/><path d="M50 22 V56"/></g></symbol>
    <!-- B: tud -->
    <symbol id="b" viewBox="0 0 100 100"><g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M14 28 V58 A12 12 0 0 0 38 58 V42"/><path d="M5 40 H24"/><circle cx="72" cy="58" r="14"/><path d="M86 18 V72"/></g></symbol>
    <!-- C: Chat-D -->
    <mask id="tuC" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><g fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M40 30 V55 A12 12 0 0 0 64 55 V41"/><path d="M31 41 H49"/></g></mask>
    <symbol id="c" viewBox="0 0 100 100"><path mask="url(#tuC)" d="M16 12 H50 A38 38 0 0 1 50 88 H30 L12 98 V16 A4 4 0 0 1 16 12 Z"/></symbol>
    <!-- Qoralamalar -->
    <symbol id="d1" viewBox="0 0 100 100"><g fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M31 24 V60 A19.5 19.5 0 0 0 70 60 V14"/><path d="M18 38 H44"/></g><circle cx="86" cy="16" r="7.5" stroke="none"/></symbol>
    <symbol id="d2" viewBox="0 0 100 100"><path d="M16 12 H50 A38 38 0 0 1 50 88 H30 L12 98 V16 A4 4 0 0 1 16 12 Z" fill="none" stroke-width="8" stroke-linejoin="round"/><g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M40 30 V55 A12 12 0 0 0 64 55 V41"/><path d="M31 41 H49"/></g></symbol>
  </defs>
</svg>

<div class="board" id="board">
  <div class="top"><h1>theusmondigital — <span>barcha logolar</span></h1><p>Shu chatdagi barcha variantlar<br>Tanlash uchun raqamini ayting</p></div>
</div>

<script>
  // kind: "paint" — symbol takes the fire gradient; "fixed" — symbol has its own colours; "img" — raster image
  const GROUPS = [
    { title: "Avvalgilari", items: [
      { n: 1, kind: "img", img: "namuna-logo.png", wide: "namuna-lockup.jpg", name: "Siz yuborgan namuna", src: "Sizning rasmingiz",
        idea: "“tu” va orbitali nuqta. Chiroyli, lekin detallari ko‘p: kichik o‘lchamda va bir rangda yo‘qolib ketadi." },
      { n: 2, kind: "fixed", id: "s-u", name: "“U” kvadrat", src: "Hozir saytda",
        idea: "Qora kvadrat ichida to‘q sariq “U”. Joriy saytdagi vaqtinchalik belgi — oddiy, ammo o‘ziga xos emas." },
      { n: 3, kind: "fixed", id: "s-tri", name: "U + uchburchak", src: "O‘quvchilar sayti",
        idea: "Oq “U” ichida to‘q sariq uchburchak — “o‘sish” belgisi. Birinchi olov rangli saytda ishlatilgan." }
    ] },
    { title: "Yangi: T · U · D", items: [
      { n: 4, kind: "paint", id: "v1", name: "D-pufak", src: "1-variant",
        idea: "Katta D ichida “tu” o‘yilgan. Mustahkam, ilova ikonkasi uchun juda mos. To‘liq brend to‘plami tayyor." },
      { n: 5, kind: "paint", id: "a", name: "Qopqoq", src: "Variant A", tag: "Tavsiya",
        idea: "U — kosa, T — qopqoq; yonboshlatsa D. Eng sodda va tez esda qoladigan shakl." },
      { n: 6, kind: "paint", id: "b", name: "tud", src: "Variant B",
        idea: "Uchala harf bir xil yumaloq chiziqda. O‘qilishi eng oson, zamonaviy va do‘stona." },
      { n: 7, kind: "paint", id: "c", name: "Chat-D", src: "Variant C",
        idea: "D — Telegram xabar pufagi, ichida “tu”. Bot va chat xizmatlari bilan darhol bog‘lanadi." }
    ] },
    { title: "Qoralamalar (ishlab chiqish jarayonidan)", items: [
      { n: 8, kind: "paint", id: "d1", name: "tu + nuqta", src: "Qoralama",
        idea: "Bir chiziqli “tu” va yonida nuqta — namunangizdagi g‘oyaning eng sodda ko‘rinishi." },
      { n: 9, kind: "paint", id: "d2", name: "Chat-D kontur", src: "Qoralama",
        idea: "Chat-D’ning ingichka chiziqli varianti. Yengil va havodor, lekin kichikda nozikroq." }
    ] }
  ];

  const svgOf = (it, size, paint) => it.kind === "fixed"
    ? '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '"><use href="#' + it.id + '"/></svg>'
    : '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '"><use href="#' + it.id + '" fill="' + paint + '" stroke="' + paint + '"/></svg>';
  const fire = "url(#fire)";

  const row = (it) => {
    const isImg = it.kind === "img";
    const big = isImg ? '<img src="' + it.img + '" alt="">' : svgOf(it, 230, fire);
    const mid = isImg
      ? '<div class="light dark"><img src="' + it.wide + '" alt=""></div>'
      : '<div class="light"><div class="lockup">' + svgOf(it, 92, fire) + '<span class="word">theusmon<b>digital</b></span></div></div>';
    const sizes = isImg
      ? '<div class="sizes"><div><img src="' + it.img + '" width="64" style="margin:0 auto 8px;border-radius:8px">64px</div><div><img src="' + it.img + '" width="32" style="margin:0 auto 8px;border-radius:4px">32px</div></div>'
      : '<div class="sizes"><div>' + svgOf(it, 64, fire) + "64px</div><div>" + svgOf(it, 32, fire) + "32px</div>" +
          (it.kind === "paint" ? "<div>" + svgOf(it, 32, "#ffffff") + "oq</div>" : "") + "</div>";
    return '<div class="row">' +
      '<div class="big"><span class="num">' + it.n + "</span>" + big + "</div>" + mid +
      '<div class="info"><span class="src">' + it.src + "</span><h2>" + it.name + (it.tag ? ' <span class="chip">' + it.tag + "</span>" : "") + "</h2><p>" + it.idea + "</p>" + sizes + "</div>" +
    "</div>";
  };

  document.getElementById("board").insertAdjacentHTML("beforeend",
    GROUPS.map((g) => '<div class="group">' + g.title + "</div>" + g.items.map(row).join("")).join("") +
    '<div class="foot">Yoqqan variant <b>raqamini</b> yozing — o‘sha logo uchun to‘liq brend to‘plamini (ikonka, SVG/PNG, brend taxtasi) tayyorlab, saytga ham qo‘yaman.</div>');
</script>
</body>
</html>
