<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>usmoai — kompyuter kovrigi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Sizes include 3 mm bleed on every side. ?size=l → 800×300 mm, ?size=xl → 900×400 mm desk mat, ?size=sm → 250×210 mm mouse pad. */
  @page { margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0706; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  svg { display: block; }
  .mat { position: relative; overflow: hidden; background: #0a0706; color: #fff; font-family: "Poppins", sans-serif; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) .3mm, transparent .3mm), linear-gradient(90deg, rgba(255,255,255,.045) .3mm, transparent .3mm); }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,90,31,.38), rgba(255,90,31,.12) 55%, transparent 75%); }
  .glow.soft { background: radial-gradient(closest-side, rgba(255,160,74,.16), transparent 72%); }
  .word { font-weight: 600; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
  .word b { font-weight: 600; background: linear-gradient(100deg, #ffa04a, #ff5a1f 60%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lockup { position: absolute; display: flex; align-items: center; }
  .tag { position: absolute; font-weight: 500; letter-spacing: .38em; text-transform: uppercase; color: #9a8d86; white-space: nowrap; }
  .handles { position: absolute; font-weight: 600; color: #cfc4be; white-space: nowrap; text-align: right; line-height: 1.6; }
  .handles span { color: #ff5a1f; }
  .bigmark { position: absolute; }
  .line { position: absolute; height: .5mm; background: linear-gradient(90deg, transparent, #ff5a1f 40%, #ffa04a); border-radius: 1mm; }

  /* ---- XL desk mat: 906 × 406 mm ---- */
  .xl { width: 906mm; height: 406mm; }
  .xl .grid { background-size: 30mm 30mm; mask-image: radial-gradient(ellipse 70% 90% at 78% 50%, #000 15%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 70% 90% at 78% 50%, #000 15%, transparent 75%); }
  .xl .glow { width: 520mm; height: 520mm; right: -40mm; top: -57mm; }
  .xl .glow.soft { width: 420mm; height: 420mm; left: -160mm; bottom: -220mm; right: auto; top: auto; }
  .xl .bigmark { width: 250mm; height: 250mm; right: 95mm; top: 70mm; filter: drop-shadow(0 0 18mm rgba(255,90,31,.45)); }
  .xl .lockup { left: 33mm; top: 30mm; gap: 6mm; }
  .xl .lockup svg { width: 26mm; height: 26mm; }
  .xl .lockup .word { font-size: 23mm; }
  .xl .tag { left: 33mm; top: 64mm; font-size: 5mm; }
  .xl .line { left: 33mm; bottom: 36mm; width: 120mm; }
  .xl .handles { right: 33mm; bottom: 26mm; font-size: 6mm; }

  /* ---- L desk mat: 806 × 306 mm (800×300 + 3 mm bleed) — big centred brand name ---- */
  .l { width: 806mm; height: 306mm; }
  .l .grid { background-size: 26mm 26mm; mask-image: radial-gradient(ellipse 60% 80% at 50% 50%, #000 10%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 60% 80% at 50% 50%, #000 10%, transparent 75%); }
  .l .glow { width: 620mm; height: 620mm; left: 93mm; top: -157mm; background: radial-gradient(closest-side, rgba(255,90,31,.26), rgba(255,90,31,.08) 55%, transparent 75%); }
  .l .center { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .l .center .lockup { position: static; gap: 6mm; }
  .l .center .lockup svg { width: 106mm; height: 106mm; filter: drop-shadow(0 0 8mm rgba(255,90,31,.45)); }
  .l .center .word { font-size: 104mm; }
  .l .center .tagline { margin-top: 14mm; font-size: 9mm; font-weight: 500; letter-spacing: .42em; text-transform: uppercase; color: #a8988f; white-space: nowrap; }
  .l .handles { right: 22mm; bottom: 18mm; font-size: 5.2mm; }
  .l .neon { position: absolute; inset: 0; width: 100%; height: 100%; }
  .l .center { z-index: 1; }
  /* Dark halo so the neon ring passes "behind" the letters instead of through them */
  .l.ring-center .center .word, .l.ring-center .center .tagline { filter: drop-shadow(0 0 2.2mm #0a0706) drop-shadow(0 0 2.2mm #0a0706) drop-shadow(0 0 1.2mm #0a0706); }
  .l.ring-corners .handles { right: auto; left: 22mm; }
  /* Neon social icons (800×300 mat) */
  .l .handles.neon-h { display: flex; align-items: center; gap: 9mm; font-size: 5.6mm; line-height: 1; }
  .l .handles .nh { display: inline-flex; align-items: center; gap: 2.6mm; color: #f3e9e3; text-shadow: 0 0 1.2mm rgba(255,120,50,.55); }
  .nh svg { width: 11mm; height: 11mm; overflow: visible; }
  /* ?ring=glow — soft neon haze behind the centre, like the small mouse pad */
  .l.ring-glow .glow { width: 400mm; height: 400mm; left: 203mm; top: -47mm; background: radial-gradient(closest-side, rgba(255,90,31,.44), rgba(255,90,31,.16) 50%, rgba(255,90,31,.05) 68%, transparent 78%); }
  .l.ring-glow .glow.halo { width: 640mm; height: 520mm; left: 83mm; top: -107mm; background: radial-gradient(closest-side, rgba(255,120,50,.10), transparent 75%); }
  .l.ring-glow .grid { background-size: 22mm 22mm; mask-image: radial-gradient(circle 190mm at 50% 50%, #000 25%, transparent 80%); -webkit-mask-image: radial-gradient(circle 190mm at 50% 50%, #000 25%, transparent 80%); }

  /* ---- SM mouse pad: 256 × 216 mm ---- */
  .sm { width: 256mm; height: 216mm; }
  .sm .grid { background-size: 16mm 16mm; mask-image: radial-gradient(ellipse 70% 70% at 50% 42%, #000 20%, transparent 78%); -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 42%, #000 20%, transparent 78%); }
  .sm .glow { width: 230mm; height: 230mm; left: 13mm; top: -32mm; }
  .sm .bigmark { width: 92mm; height: 92mm; left: 82mm; top: 40mm; filter: drop-shadow(0 0 9mm rgba(255,90,31,.5)); }
  .sm .center { position: absolute; left: 0; right: 0; top: 146mm; text-align: center; }
  .sm .center .word { font-size: 17mm; }
  .sm .center .tagline { margin-top: 6mm; font-size: 3.4mm; font-weight: 500; letter-spacing: .38em; text-transform: uppercase; color: #9a8d86; }
  .sm .handles { left: 0; right: 0; bottom: 14mm; text-align: center; font-size: 3.6mm; color: #8a7e78; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="14" y1="8" x2="86" y2="92"><stop offset="0" stop-color="#ffa04a"/><stop offset="1" stop-color="#ff4a12"/></linearGradient>
    <linearGradient id="neonIcon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc07a"/><stop offset=".5" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ff4a12"/></linearGradient>
    <filter id="iconGlow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="wide"/><feGaussianBlur in="SourceGraphic" stdDeviation=".5" result="tight"/><feMerge><feMergeNode in="wide"/><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="n-tg" viewBox="0 0 24 24" overflow="visible"><g filter="url(#iconGlow)" fill="none" stroke="url(#neonIcon)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.2"/><path d="M6.6 11.7 17 7.6l-1.9 9.1-3.9-2.8"/><path d="M17 7.6 9.8 13l-.3 3.3 1.7-2.4"/></g></symbol>
    <symbol id="n-ig" viewBox="0 0 24 24" overflow="visible"><g filter="url(#iconGlow)"><g fill="none" stroke="url(#neonIcon)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.4"/></g><circle cx="17.4" cy="6.6" r="1.1" fill="url(#neonIcon)"/></g></symbol>
    <symbol id="mark" viewBox="0 0 100 100"><g transform="translate(1.25 1.75)"><path d="M26 36 V58 A22 22 0 0 0 70 58 V40" fill="none" stroke="url(#fire)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="18" r="8" fill="url(#fire)"/></g></symbol>
  </defs>
</svg>

<div id="mat"></div>

<script>
  const size = ({ sm: "sm", l: "l" })[new URLSearchParams(location.search).get("size")] || "xl";
  const mark = '<svg viewBox="0 0 100 100"><use href="#mark"/></svg>';
  const word = '<span class="word">usmo<b>ai</b></span>';
  const TAG = "G‘oyangiz — aqlli yechim";
  // ?ring=center → neon ring behind the name; ?ring=corners → neon arcs in two corners; ?ring=glow → soft neon haze
  const ring = new URLSearchParams(location.search).get("ring");
  const NEON_DEFS = '<defs><linearGradient id="neonG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc07a"/><stop offset=".45" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ff3d0f"/></linearGradient>' +
    '<filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b2"/><feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  const tube = (d, w, o) => '<path d="' + d + '" fill="none" stroke="url(#neonG)" stroke-width="' + w + '" stroke-linecap="round" opacity="' + o + '" filter="url(#neonGlow)"/>';
  const neon = ring === "center"
    ? '<svg class="neon" viewBox="0 0 806 306" preserveAspectRatio="none">' + NEON_DEFS +
        '<circle cx="403" cy="150" r="128" fill="none" stroke="url(#neonG)" stroke-width="2.6" filter="url(#neonGlow)" opacity=".95"/>' +
        '<circle cx="403" cy="150" r="140" fill="none" stroke="url(#neonG)" stroke-width="1" filter="url(#neonGlow)" opacity=".35"/></svg>'
    : ring === "corners"
    ? '<svg class="neon" viewBox="0 0 806 306" preserveAspectRatio="none">' + NEON_DEFS +
        tube("M -10 118 A 128 128 0 0 1 118 -10", 2.6, .95) + tube("M -10 146 A 156 156 0 0 1 146 -10", 1, .4) +
        tube("M 816 188 A 128 128 0 0 1 688 316", 2.6, .95) + tube("M 816 160 A 156 156 0 0 1 660 316", 1, .4) + "</svg>"
    : "";
  document.getElementById("mat").outerHTML = size === "l"
    ? '<div class="mat l' + (ring ? " ring-" + ring : "") + '" id="mat"><div class="glow"></div>' + (ring === "glow" ? '<div class="glow halo"></div>' : "") + '<div class="grid"></div>' + neon +
        '<div class="center"><div class="lockup">' + mark + word + '</div><div class="tagline">' + TAG + "</div></div>" +
        '<div class="handles neon-h"><span class="nh"><svg viewBox="0 0 24 24"><use href="#n-tg"/></svg>@usmoai</span><span class="nh"><svg viewBox="0 0 24 24"><use href="#n-ig"/></svg>@usmo_ai</span></div>' +
      "</div>"
    : size === "xl"
    ? '<div class="mat xl" id="mat"><div class="glow soft"></div><div class="glow"></div><div class="grid"></div>' +
        '<div class="bigmark">' + mark + "</div>" +
        '<div class="lockup">' + mark + word + "</div>" +
        '<div class="tag">' + TAG + "</div>" +
        '<div class="line"></div>' +
        '<div class="handles">Telegram <span>@usmoai</span> · Instagram <span>@usmo_ai</span></div>' +
      "</div>"
    : '<div class="mat sm" id="mat"><div class="glow"></div><div class="grid"></div>' +
        '<div class="bigmark">' + mark + "</div>" +
        '<div class="center">' + word + '<div class="tagline">' + TAG + "</div></div>" +
        '<div class="handles">@usmoai · @usmo_ai</div>' +
      "</div>";
</script>
</body>
</html>
